server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # REST
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
  }

  # SignalR: WebSocket upgrade, and no buffering for long polling / SSE fallbacks
  location /hubs/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  # Single-page app: unknown paths fall back to index.html so /devices/... survives a refresh
  location / {
    try_files $uri /index.html;
  }
}

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes:
      - ./infrastructure/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      # $$ stops Compose from treating $SYS as one of its own variables
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/uptime' -C 1 -W 3 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s
    restart: unless-stopped
  
  monitor:
    image: eclipse-mosquitto:2
    entrypoint: ["mosquitto_sub", "-h", "mosquitto", "-t", "factory/#", "-v"]
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["debug"]

  sim-pump01:
    build: ./simulators
    environment:
      DEVICE_ID: pump01
      BROKER_HOST: mosquitto      
      PUBLISH_INTERVAL_MS: 1000
      SENSORS: temperature,pressure
    depends_on: [mosquitto]

  sim-motor02:
    build: ./simulators
    environment:
      DEVICE_ID: motor02
      LINE: line2
      BROKER_HOST: mosquitto
      PUBLISH_INTERVAL_MS: 
      SENSORS: temperature,vibration
    depends_on: [mosquitto]
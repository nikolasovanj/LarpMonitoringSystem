services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes:
      - ./infrastructure/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      # $$ stops Compose from treating $SYS as one of its own variables
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/uptime' -C 1 -W 3 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s
    restart: unless-stopped
  
  monitor:
    image: eclipse-mosquitto:2
    entrypoint: ["mosquitto_sub", "-h", "mosquitto", "-t", "factory/#", "-v"]
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["debug"]

  sim-pump01:
    build: ./simulators
    environment:
      DEVICE_ID: pump01
      BROKER_HOST: mosquitto      
      PUBLISH_INTERVAL_MS: 1000
      SENSORS: temperature,pressure,flow
    depends_on: [mosquitto]

  sim-motor02:
    build: ./simulators
    environment:
      DEVICE_ID: motor02
      LINE: line2
      BROKER_HOST: mosquitto
      PUBLISH_INTERVAL_MS: 
      SENSORS: temperature,vibration,current
    depends_on: [mosquitto]

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: iot
      POSTGRES_PASSWORD: ${DB_PASSWORD:-iot_dev_password}
      POSTGRES_DB: iot
    ports: ["5432:5432"]
    volumes:
      - tsdb-data:/var/lib/postgresql/data
      - ./infrastructure/timescaledb/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iot -d iot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  
  ingestion:
    build: ./backend
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      Mqtt__Host: mosquitto
      ConnectionStrings__Timescale: "Host=timescaledb;Port=5432;Database=iot;Username=iot;Password=${DB_PASSWORD:-iot_dev_password}"
    depends_on:
      mosquitto:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      Mqtt__Host: mosquitto
      ConnectionStrings__Timescale: "Host=timescaledb;Port=5432;Database=iot;Username=iot;Password=${DB_PASSWORD:-iot_dev_password}"
      Cors__Origins__0: "http://localhost:5173"
    depends_on:
      mosquitto:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

  alerting:
    build:
      context: ./backend
      dockerfile: Dockerfile.alerting
    restart: unless-stopped
    environment:
      Mqtt__Host: mosquitto
      ConnectionStrings__Timescale: "Host=timescaledb;Port=5432;Database=iot;Username=iot;Password=${DB_PASSWORD:-iot_dev_password}"
    depends_on:
      mosquitto:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
volumes:
  mosquitto-data:
  tsdb-data: